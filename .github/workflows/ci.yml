# SAFE: This workflow does not consume any untrusted github.event.* inputs in run: steps.
# All inputs are CI-controlled. No issue/PR titles, comments, or commit messages are
# interpolated into shell commands. See:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # DEC-018 prerequisite: surface Node 22 issues even when Node 20 is green
      # (or vice versa). Treat each Node version as a first-class signal.
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Print runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # actions/upload-artifact@v4 forbids duplicate artifact names inside
          # the same workflow run; suffix the matrix Node version so each cell
          # uploads under a unique artifact.
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
